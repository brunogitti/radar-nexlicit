# NexLicit Radar — dicionário de palavras-chave por segmento
# Este arquivo é lido em tempo de execução. Editar aqui muda o que o radar captura,
# sem tocar em uma linha de código Python.
#
# Como funciona cada regra:
#   - "termos" é uma lista. TODOS os termos da lista precisam aparecer no texto do
#     edital para a regra bater (lógica E). Uma lista de um item só = termo simples.
#   - "excluir" (opcional) derruba a regra se qualquer um desses termos aparecer.
#   - A comparação é feita sobre o texto normalizado: minúsculo, sem acento,
#     e por radical (prefixo), então "limpeza" bate "Limpeza", "LIMPEZA" e
#     "produtos de limpezas". Ver regras de normalização no config abaixo.

versao: 1

config:
  ignorar_acentos: true
  ignorar_maiusculas: true
  # casar por radical: o termo bate se aparecer como prefixo de uma palavra do texto.
  # Ex.: termo "camiset" bate camiseta / camisetas.
  casar_por_radical: true
  # tamanho mínimo do termo para permitir radical. Abaixo disso exige palavra inteira,
  # senão "cabo" viraria "cabotagem" e "copo" viraria "coproprietário".
  min_radical: 5
  campos_analisados:
    - objetoCompra
    - informacaoComplementar

segmentos:

  - nome: Limpeza
    regras:
      - termos: [material, limpeza]
      # "materiais" (plural de material) precisa de regra propria: o
      # casamento por radical exige que a palavra do texto COMECE com o
      # termo, e "materiais" diverge de "material" bem na ultima letra
      # (l vs i), entao o radical "material" nao pega esse plural.
      # Confirmado com edital real de Barretos (Etapa de calibracao).
      # Mesmo problema em qualquer regra que hoje usa so "material": ao
      # criar uma regra nova assim, repetir tambem com "materiais".
      - termos: [materiais, limpeza]
      - termos: [produtos, limpeza]
      - termos: [detergente]
      - termos: [agua sanitaria]
      - termos: [desinfetante]
      - termos: [sabao]
      - termos: [limpador]
      - termos: [vassoura]
      - termos: [alcool]
        excluir: [alcool em gel hospitalar, alcool 70 hospitalar]
      - termos: [papel, higienico]
      - termos: [papel, toalha]
      - termos: [saco, lixo]
      - termos: [pano, chao]
      - termos: [pano, prato]

  - nome: Expediente
    regras:
      - termos: [material, expediente]
      - termos: [materiais, expediente]
      - termos: [material, escritorio]
      - termos: [materiais, escritorio]
      - termos: [papel, sulfite]
      - termos: [papel, a4]
      - termos: [caneta]
      - termos: [lapis]
      - termos: [borracha, escolar]
      - termos: [pasta, arquivo]
      - termos: [envelope]
      - termos: [caderno]
      - termos: [agenda]

  - nome: Copa e cozinha
    regras:
      - termos: [copa, cozinha]
      - termos: [material, copa]
      - termos: [materiais, copa]
      - termos: [cafe]
      - termos: [acucar]
      - termos: [copo, descartavel]
      - termos: [garrafa, termica]
      - termos: [colher]
      - termos: [prato]

  - nome: Gêneros alimentícios
    regras:
      - termos: [generos, alimenticios]
      - termos: [merenda]
      - termos: [hortifruti]
      - termos: [arroz]
      - termos: [carne]
      - termos: [leite]
      - termos: [oleo, soja]
      - termos: [cesta, basica]

  - nome: Descartáveis
    regras:
      - termos: [descartavel]
      - termos: [descartaveis]

  - nome: Informática
    regras:
      - termos: [informatica]
      - termos: [notebook]
      - termos: [computador]
      # excluir: [monitoramento] porque "monitor" (7 letras, casa por
      # prefixo) batia dentro de "monitoramento" (ex.: monitoramento
      # continuo de glicose), que nao tem nada a ver com monitor de
      # computador. Confirmado com edital real de Fernandopolis.
      - termos: [monitor]
        excluir: [monitoramento]
      - termos: [mouse]
      - termos: [teclado]
      - termos: [pendrive]
      - termos: [nobreak]
      - termos: [no-break]
      - termos: [roteador]
      - termos: [impressora]

  - nome: Eletrônicos
    regras:
      # termos soltos [eletronico]/[eletronicos] foram removidos: a palavra
      # "eletronico" aparece direto em texto burocratico sem relacao com o
      # produto ("Pregao Eletronico", "ambiente eletronico" do Compras.Gov),
      # entao exigimos uma palavra companheira que so aparece quando o
      # produto de fato e eletronico.
      # excluir: [ambiente eletronico] derruba o caso em que a palavra
      # companheira (equipamento/aparelho/produto) aparece no objeto por um
      # motivo qualquer, e "eletronico" so aparece pelo texto padrao do
      # Compras.Gov na informacaoComplementar, sem relacao com o produto.
      - termos: [equipamento, eletronico]
        excluir: [ambiente eletronico]
      - termos: [aparelho, eletronico]
        excluir: [ambiente eletronico]
      - termos: [produto, eletronico]
        excluir: [ambiente eletronico]

  - nome: Elétrica
    regras:
      - termos: [material, eletrico]
      - termos: [materiais, eletrico]
      - termos: [lampada]
      - termos: [luminaria]
      - termos: [refletor]
      - termos: [cabo, eletrico]
      - termos: [cabo, flexivel]

  - nome: Hidráulica
    regras:
      - termos: [material, hidraulico]
      - termos: [materiais, hidraulico]
      - termos: [torneira]
      - termos: [mangueira]
      - termos: [tubo, pvc]
      - termos: [caixa, dagua]
      - termos: [caixa, agua]
      - termos: [bomba, agua]

  - nome: Construção
    regras:
      - termos: [material, construcao]
      - termos: [materiais, construcao]
      - termos: [cimento]
      - termos: [areia]
      - termos: [brita]
      - termos: [tijolo]
      - termos: [telha]
      - termos: [ferragem]

  - nome: Tinta e Pintura
    # Segmento separado de Construcao (de onde "tinta" veio) porque a lista
    # de termos de tinta/pintura cresceu bastante: mantida dentro de
    # Construcao, todo edital de tinta tambem apareceria com o rotulo
    # generico "Construcao", atrapalhando a triagem. Mesmo raciocinio usado
    # pra separar Pilha e Bateria de Automotivo. "massa corrida" tambem
    # veio de Construcao pelo mesmo motivo: e produto de preparo de pintura.
    regras:
      - termos: [tinta]
      - termos: [esmalte, sintetico]
      - termos: [verniz, maritimo]
      - termos: [verniz, acrilico]
      - termos: [verniz, sintetico]
      - termos: [verniz, brilhante]
      - termos: [verniz, fosco]
      - termos: [selador, acrilico]
      - termos: [selador, parede]
      - termos: [selador, pigmentado]
      # "fundo" nunca aparece sozinho: a calibracao (03/08/2026, 337
      # editais abertos) mostrou "fundo" batendo 4 vezes sem nenhuma
      # relacao com pintura (sempre "Fundo Municipal de Saude/Assistencia
      # Social", sentido administrativo). Precisa sempre de uma palavra
      # companheira especifica de pintura.
      - termos: [fundo, preparador]
      - termos: [fundo, sintetico]
      - termos: [fundo, anticorrosivo]
      - termos: [fundo, madeira]
      - termos: [fundo, metal]
      - termos: [primer]
      - termos: [textura, acrilica]
      - termos: [textura, projetada]
      - termos: [grafiato]
      - termos: [revestimento, texturizado]
      - termos: [impermeabilizante]
      - termos: [manta, liquida]
      - termos: [resina, impermeabilizante]
      - termos: [resina, acrilica]
      - termos: [resina, piso]
      # [resina, agua] foi cogitado e descartado: a mesma calibracao mostrou
      # "agua" batendo em 10 editais sem relacao com tinta (aparece ate no
      # nome de autarquias tipo SAAE, Servico Autonomo de Agua e Esgoto,
      # contaminando qualquer edital delas), risco de falso positivo maior
      # que o ganho de recall.
      - termos: [thinner]
      - termos: [aguarras]
      - termos: [massa, corrida]
      # "pincel"/"rolo" sozinhos tambem sao ambiguos ("rolo compactador" ja
      # apareceu na calibracao, sem relacao com pintura). Compostos com
      # "pintura", nao "tinta", pra nao empilhar a ambiguidade de "tinta"
      # (cartucho de impressora) em cima da deles.
      - termos: [pincel, pintura]
      - termos: [rolo, pintura]

  - nome: Gráfico
    regras:
      - termos: [material, grafico]
      - termos: [materiais, grafico]
      - termos: [servico, grafico]
      - termos: [letreiro]
      - termos: [comunicacao, visual]

  - nome: Uniformes e vestuário
    regras:
      - termos: [uniforme]
      - termos: [confeccao, uniforme]
      - termos: [vestuario]
      - termos: [camiseta]
      - termos: [jaleco]
      - termos: [avental]
      - termos: [calca]
      - termos: [roupa]

  - nome: EPI
    regras:
      - termos: [epi]
      - termos: [equipamento, protecao, individual]
      - termos: [luva]
      - termos: [mascara]
      - termos: [capacete]
      - termos: [botina]
      - termos: [oculos, protecao]

  - nome: Móveis
    regras:
      - termos: [mobiliario]
      - termos: [cadeira]
      - termos: [mesa, escritorio]
      - termos: [armario]
      - termos: [estante]

  - nome: Automotivo
    regras:
      - termos: [pneu]
      - termos: [bateria, automotiva]
      - termos: [oleo, lubrificante]
      - termos: [filtro, oleo]
      - termos: [peca, veiculo]
      - termos: [autopeca]

  - nome: Pilha e Bateria
    regras:
      - termos: [bateria]
      - termos: [pilha]

  - nome: Piscina
    regras:
      - termos: [piscina]
      - termos: [cloro]
      # [tratamento, agua] foi removido: pegava estacao de tratamento de
      # agua municipal (para consumo humano), que nao tem nada a ver com
      # piscina. Qualquer tratamento de agua DE PISCINA vai mencionar a
      # palavra "piscina" no objeto, entao a regra [piscina] sozinha ja
      # cobre esse caso, sem o falso positivo.
      - termos: [produtos, quimicos, agua]

  - nome: Decoração
    regras:
      - termos: [decoracao]
      - termos: [material, decorativo]
      - termos: [materiais, decorativo]

  - nome: Embalagens Plásticas
    # Segmento pra fabricante de saco plastico, cliente novo da NexLicit.
    # [saco, lixo] repete de proposito a mesma regra que ja existe em
    # Limpeza (nao move, duplica): um edital de saco de lixo interessa
    # tanto a quem compra pra limpeza quanto ao fabricante. Mesmo padrao
    # ja usado com "bateria automotiva" (Automotivo e Pilha e Bateria).
    regras:
      - termos: [sacola, plastica]
      - termos: [saco, plastico]
      - termos: [embalagem, plastica]
      - termos: [bobina, plastica]
      - termos: [filme, plastico]
      - termos: [saco, lixo]
      - termos: [saco, hospitalar]
      - termos: [saco, infectante]
      - termos: [saco, leitoso]
      # "polietileno" comecou solto na proposta, mas a calibracao
      # (14/08/2026, 378 editais abertos) achou um caso real de escopo
      # largo demais: "chapas de polietileno de alta densidade" pra
      # revestir cacamba de caminhao basculante, nada a ver com saco ou
      # embalagem. Composto com uma palavra de embalagem em vez de
      # deixado solto, decisao do Bruno. As 3 formas abaixo foram
      # recalibradas (15/08/2026, 382 editais abertos) sem bater nesse
      # caso nem em nenhum outro falso positivo.
      - termos: [polietileno, saco]
      - termos: [polietileno, sacola]
      - termos: [polietileno, filme]
      - termos: [embalagem, flexivel]
      - termos: [artefato, plastico]

  - nome: Locação de Brinquedos e Recreação
    # Cliente novo da NexLicit: locacao de brinquedo infantil/inflavel e
    # recreacao pra evento (castelo inflavel, touro mecanico, cama
    # elastica, carrinho de pipoca/algodao doce, etc), nao fabricante nem
    # fornecedor de brinquedo pedagogico. "brinquedo"/"locacao"/"aluguel"
    # nunca aparecem soltos de proposito: sozinhos trariam ruido de compra
    # de brinquedo pedagogico pra escola/creche, que nao e o nicho dele
    # (confirmado na calibracao de 16/09/2026, 355 editais abertos: o
    # termo "infantil" sozinho bateu numa aquisicao real de "playground
    # infantil para apoio didatico pedagogico" numa EMEI).
    regras:
      - termos: [brinquedo, inflavel]
      # [brinquedo, recreativo] comecou com 2 termos na proposta, mas a
      # calibracao (16/09/2026) achou um falso positivo real: bateu numa
      # aquisicao de material pedagogico em Santa Fe do Sul/SP ("aquisicao
      # de materiais recreativos, jogos educativos e brinquedos... para as
      # Secretarias"), ao lado de 2 acertos genuinos (Fernandopolis/SP,
      # Fronteira/MG). Reforcado pra 3 termos com "servico": confirmado
      # contra o texto completo e real do edital de Santa Fe do Sul
      # (17/09/2026) que isso derruba o falso positivo sem perder nenhum
      # dos 2 acertos genuinos, porque os dois usam "prestacao de
      # servicos" e a compra pedagogica nao usa essa palavra em lugar
      # nenhum do texto.
      - termos: [brinquedo, recreativo, servico]
      - termos: [brinquedo, evento]
      - termos: [locacao, brinquedo]
      - termos: [aluguel, brinquedo]
      # "recreacao" fica solto: testado na calibracao, sem nenhum caso de
      # ambiguidade real (recreacao escolar/idoso) ate agora. Se aparecer,
      # compor com "evento" ou "infantil".
      - termos: [recreacao]
      - termos: [parque, infantil]
      - termos: [parque, diversao]
      # "pula-pula": o hifen normaliza pra ESPACO, nao some (confirmado
      # com teste real em captura/normalizacao.py), entao "pula-pula"
      # vira duas palavras "pula pula", nao uma palavra so "pulapula" (que
      # nunca bateria em nada) nem o termo solto "pula" (4 letras, curto
      # demais pro min_radical, bateria em qualquer uso do verbo "pular").
      # Um item so na lista com espaco = frase exata, mesmo padrao ja
      # usado em "agua sanitaria" no segmento Limpeza.
      - termos: [pula pula]
      - termos: [cama, elastica]
      - termos: [castelo, inflavel]
      # "tobogã" comecou solto na proposta, mas tem o mesmo risco que o
      # Bruno ja tinha identificado pro "escorregador" (aparece em compra
      # de playground/parquinho escolar, obra publica, nao locacao de
      # evento). Composto com "piscina", espelhando exatamente a regra do
      # escorregador logo abaixo. "tobogã aquático"/"toboágua" ficou de
      # fora por enquanto: nenhuma das variantes testadas (frase exata,
      # composta, forma com hifen) bateu em nada real nas duas
      # calibracoes, sem base pra cravar uma grafia especifica ainda.
      - termos: [toboga, piscina]
      - termos: [escorregador, piscina]
      - termos: [piscina, bolinha]
      - termos: [futebol, sabao]
      - termos: [guerra, cotonete]
      - termos: [touro, mecanico]
      - termos: [touro, inflavel]
      - termos: [futebol, inflavel]
      - termos: [carrinho, pipoca]
      - termos: [carrinho, algodao]
      - termos: [carrinho, churros]
      - termos: [carrinho, alimentacao]

# Termos vetados globalmente: se aparecerem, o edital é descartado mesmo que uma
# regra tenha batido. Serve para cortar ruído recorrente. Comece vazio e vá
# preenchendo conforme os falsos positivos aparecerem nos primeiros dias de uso.
exclusoes_globais: []
