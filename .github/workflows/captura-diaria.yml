name: Captura diaria

# Este workflow NAO tem mais agendamento proprio ("schedule"): o gatilho do
# GitHub atrasava de 5 a 10 horas. Quem dispara a captura agora e:
#   - o disparo externo (agendador gratuito) as 7h07 e 13h07 de Brasilia, e
#   - o workflow "Agendador da captura" (agendador.yml), de 2 em 2 horas, que
#     so dispara se o banco nao foi publicado nas ultimas 5 horas.
# Os dois chamam o gatilho abaixo (workflow_dispatch). Passo a passo e
# detalhes em docs/operacao-agendamento.md.
on:
  workflow_dispatch: # disparo externo, agendador.yml, ou a mao pela interface do GitHub
    inputs:
      permitir_inicio_do_zero:
        description: "So na PRIMEIRA execucao de todas (nao existe branch data nem backups): permite criar um banco novo. Deixe desligado no uso normal."
        type: boolean
        default: false
      permitir_reducao_do_banco:
        description: "Permite publicar um banco com MENOS editais que o da branch data. So para uma reducao feita de proposito. Nunca libera banco vazio."
        type: boolean
        default: false
      reprocessar_itens_truncados:
        description: "Busca de novo os itens dos editais ABERTOS que ficaram com exatamente 10 itens (ou nenhum) e grava no banco. So para rodar uma vez, a mao. Nao reclassifica nada. Deixe desligado no uso normal."
        type: boolean
        default: false
      enviar_email:
        description: "Envia o e-mail de editais novos (e o semanal, na segunda). Desligue so para uma carga inicial, como a primeira captura de um estado novo: o banco e gravado normalmente e os editais nao voltam como novos depois."
        type: boolean
        default: true

# Uma execucao por vez, sempre. Se uma execucao manual coincidir com a
# agendada, a segunda ESPERA a primeira terminar (cancel-in-progress: false
# nao cancela a que ja esta rodando). Sem isso, as duas poderiam publicar o
# banco ao mesmo tempo e a ultima apagaria o trabalho da outra.
concurrency:
  group: banco-radar
  cancel-in-progress: false

jobs:
  capturar:
    runs-on: ubuntu-latest
    # Teto explicito de 3 horas (o padrao do GitHub e 6). Com GO (389
    # municipios) a captura deve levar cerca de 1h45 (medido em 25/11/2026: 67
    # min so de GO, mais cerca de 35 min dos outros 143), mais em dia de PNCP
    # lento. Uma execucao travada nao pode ocupar a fila (concurrency) por 6
    # horas e segurar as proximas. Se estourar, o banco nao e publicado e a
    # branch data continua com o ultimo banco bom.
    timeout-minutes: 180
    permissions:
      contents: write # precisa poder empurrar (push) pras branches "data" e "backups" no final
    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # A branch "data" e a unica fonte de persistencia do dados/radar.db:
      # e nela que o banco fica salvo entre uma execucao e outra, e e ela
      # tambem que o painel no Streamlit Cloud le pra mostrar os editais.
      #
      # Este passo NUNCA apaga o banco nem comeca do zero por engano: se nao
      # conseguir falar com o GitHub, ou se o banco salvo estiver estragado,
      # o job FALHA (e o GitHub avisa por e-mail) antes de capturar qualquer
      # coisa ou mandar qualquer e-mail. A logica toda esta explicada em
      # .github/scripts/restaurar_banco.sh e em docs/operacao-banco.md.
      - name: Restaurar o banco de dados ja vistos (branch data)
        env:
          PERMITIR_INICIO_DO_ZERO: ${{ inputs.permitir_inicio_do_zero }}
        run: bash .github/scripts/restaurar_banco.sh

      # So roda quando alguem liga o input reprocessar_itens_truncados no
      # disparo manual (nas execucoes agendadas fica desligado). Vem DEPOIS
      # de restaurar (o banco ja foi conferido) e ANTES da captura. O backup
      # do banco anterior sai da copia feita na restauracao, entao ele nao
      # inclui estes itens novos. Nao muda segmento nem envia e-mail. Se der
      # erro de rede num edital, ele so fica sem itens novos (nada se perde).
      - name: Reprocessar itens truncados (so se o input estiver ligado)
        if: ${{ inputs.reprocessar_itens_truncados }}
        run: python scripts/reprocessar_itens_truncados.py --banco dados/radar.db --gravar

      - name: Rodar os testes automatizados
        run: python -m pytest tests/ -q

      # Sem o input enviar_email (disparo do agendador externo ou do
      # agendador.yml), o GitHub usa o padrao "true" e o e-mail sai normal.
      # Com "false", o main.py roda sem --enviar-email: captura, grava o
      # banco e registra a execucao, mas nao manda nada.
      - name: Capturar editais e enviar e-mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
          ENVIAR_EMAIL: ${{ inputs.enviar_email }}
        run: |
          if [ "$ENVIAR_EMAIL" = "false" ]; then
            echo "enviar_email desligado: captura sem nenhum e-mail"
            python main.py --dias 30
          else
            python main.py --dias 30 --enviar-email "$EMAIL_DESTINATARIO"
          fi

      # Publica o banco atualizado, mas so depois de conferir que ele esta
      # inteiro, nao esta vazio e nao tem menos editais que o banco que ja
      # estava na branch data. Antes de sobrescrever, guarda um backup
      # datado e compactado do banco anterior na branch "backups" (mantem os
      # 7 mais recentes). Os dois envios tentam de novo em caso de falha de
      # rede. Detalhes em .github/scripts/publicar_banco.sh.
      #
      # A branch data continua sendo recriada do zero a cada execucao (codigo
      # atual da master + o banco, um commit so, --force), como antes: ela
      # existe so pra alimentar o painel, nao faz parte do historico "de
      # portfolio" do projeto (isso continua sendo so a branch master).
      - name: Publicar o banco atualizado (branches data e backups)
        env:
          PERMITIR_INICIO_DO_ZERO: ${{ inputs.permitir_inicio_do_zero }}
          PERMITIR_REDUCAO_DO_BANCO: ${{ inputs.permitir_reducao_do_banco }}
        run: bash .github/scripts/publicar_banco.sh
